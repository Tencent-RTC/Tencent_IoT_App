plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.tencent.iot.aiglasses'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tencent.iot.aiglasses'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ['**/libliteavsdk.so']
        }
    }
}

dependencies {
    implementation 'com.tencent.liteav:LiteAVSDK_Professional:13.6.0.20747'
    implementation 'com.tencent.liteav:LiteAVSDK_VoiceAI:13.6.0.255'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
